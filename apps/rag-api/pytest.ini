[pytest]
; pytest resets warning filters per-test via its own catch_warnings() wrapper, so
; a plain warnings.filterwarnings() call in app code doesn't suppress this under
; pytest — same root cause as apps/support-agent/pytest.ini. The Couchbase SDK's
; scope.search() request builder unconditionally *reads* the deprecated
; SearchOptions.scope_name property internally, regardless of caller code — same
; as notebooks 02/03 and apps/support-agent.
filterwarnings =
    ignore:.*scope_name.*:couchbase.logic.supportability.CouchbaseDeprecationWarning
    ; FastAPI's own TestClient import triggers this — nothing in our test code to
    ; fix. StarletteDeprecationWarning subclasses UserWarning, not DeprecationWarning.
    ignore:.*httpx2.*:starlette.exceptions.StarletteDeprecationWarning
