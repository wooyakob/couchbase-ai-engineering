[pytest]
; pytest wraps each test in its own warnings.catch_warnings(), which resets filters
; registered at import time (agent/graph.py's warnings.filterwarnings calls) — these
; have to be configured here instead to actually take effect under pytest. Same three
; library-internal warnings suppressed there; see agent/graph.py for why each is safe
; to ignore.
filterwarnings =
    ignore:.*\.text\(\).*:DeprecationWarning
    ignore:.*create_react_agent.*:DeprecationWarning
    ; CouchbaseDeprecationWarning subclasses UserWarning, not DeprecationWarning
    ignore:.*scope_name.*:couchbase.logic.supportability.CouchbaseDeprecationWarning
